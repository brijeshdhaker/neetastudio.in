[General]
upload_max_filesize = 200M
post_max_size = 220M

[PHPUnit]
error_reporting=-1
zend.assertions=1
assert.exception=1
memory_limit=-1
;extension=mbstring

[xdebug-3.0]
xdebug.mode=develop,debug,coverage
xdebug.client_host=docker.sandbox.net
xdebug.client_port=9003
;xdebug.idekey=vscode
xdebug.start_with_request=yes

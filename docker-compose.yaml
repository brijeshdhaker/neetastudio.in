---


services:
  ## Mysql Server
  mysqlserver:
    image: mysql:8.0.33
    container_name: mysqlserver
    hostname: mysqlserver.sandbox.net
    restart: always
    ports:
      - "3306:3306"
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
    volumes:
      - sandbox_apps_path:/apps
      - sandbox_mysql_data:/var/lib/mysql
      - ./conf/mysql:/etc/mysql/conf.d
      - ./conf/mysql/init-setup.sh:/docker-entrypoint-initdb.d/init-setup.sh
    secrets:
      - mysql-root-password
    env_file:
      - ./conf/mysql/envvars
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=$$MYSQL_ADMIN_PASSWORD --execute \"SHOW DATABASES;\""
      # test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ADMIN_PASSWORD']
      timeout: 20s
      retries: 10
      interval: 10s
    extra_hosts:
      - "docker.sandbox.net:172.18.0.1"
      
  ## Apache Server
  apacheserver:
    image: neetastudio.in:php-8.5.8
    build:
      context: .
      target: development
    container_name: apacheserver
    hostname: apacheserver.sandbox.net
    restart: always
    depends_on:
      mysqlserver:
        condition: service_healthy
    ports:
      - "8000:80"
    volumes:
      - sandbox_apps_path:/apps
      - $PWD:/var/www/html
      - $PWD/conf/apache/apache2.conf:/etc/apache2/apache2.conf
      - $PWD/conf/apache/envvars:/etc/apache2/envvars
      - /apps/var/logs/neetastudio.in:/var/log/neetastudio.in:rw      
    env_file:
      - $PWD/.env
    secrets:
      - mysql-root-password
    environment:
      - APP_ENV=DEV
      - APP_NAME=ONLINE
      - DB_PASSWORD_FILE_PATH=/run/secrets/mysql-root-password
      - XDEBUG_MODE=develop,debug,coverage
    healthcheck:
      test: echo $(hostname -f) || exit 1
      # test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    develop:
      watch:
        - action: sync
          path: $PWD
          target: /var/www/html
    extra_hosts:
      - "docker.sandbox.net:172.18.0.1"      


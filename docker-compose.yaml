volumes:
  sandbox_apps_path:
    external: true
  sandbox_mysql_data:
    external: true

#
secrets:
  mysql-root-password:
    file: $PWD/conf/mysql/password.txt

#
networks:
  default:
    external: true
    driver: bridge
    name: sandbox.net